<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RunDance · Beat</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #f4f2ef;
    --dim: #6b6878;
    --hot: #ff3d81;
    --warm: #ffb03d;
    --cool: #3dd6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 20px 24px 0;
  }
  .brand { font-weight: 800; letter-spacing: 0.16em; font-size: 14px; }
  .brand em { font-style: normal; color: var(--hot); }
  .proto { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; }

  /* idle screen */
  #idle { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
  #idle h1 { font-size: 28px; font-weight: 800; line-height: 1.2; }
  #idle p { color: var(--dim); font-size: 15px; line-height: 1.5; max-width: 300px; }
  #startBtn {
    font: inherit; font-size: 18px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--bg); background: linear-gradient(135deg, var(--hot), var(--warm));
    border: none; border-radius: 999px; padding: 18px 52px;
    box-shadow: 0 0 40px rgba(255, 61, 129, 0.35);
  }
  #startBtn:active { transform: scale(0.97); }
  .err { color: var(--warm); font-size: 13px; max-width: 300px; }

  /* live screen */
  #live { display: none; flex-direction: column; align-items: center; width: 100%; }
  #pulse {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dim); margin-bottom: 6px;
    transition: transform 0.06s ease-out, background 0.06s;
  }
  #pulse.hit { background: var(--hot); transform: scale(1.9); box-shadow: 0 0 24px var(--hot); }
  #spm {
    font-size: min(38vw, 168px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  #spm.idlebeat { color: var(--dim); }
  #spmLabel { color: var(--dim); letter-spacing: 0.28em; font-size: 13px; margin-top: 2px; }
  #spark { width: min(78vw, 420px); height: 56px; margin-top: 26px; opacity: 0.9; }
  #stats { display: flex; gap: 26px; margin-top: 18px; color: var(--dim); font-size: 12px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  #stats b { color: var(--ink); font-weight: 600; }
  #stopBtn {
    margin-top: 34px; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.12em;
    color: var(--dim); background: none; border: 1px solid #2a2836; border-radius: 999px; padding: 10px 28px;
  }
  footer { text-align: center; color: #3c3948; font-size: 10px; padding: 14px; letter-spacing: 0.06em; }
  #demoBtn {
    position: fixed; right: 14px; bottom: 14px; font-size: 10px; color: var(--dim);
    background: none; border: 1px dashed #2a2836; border-radius: 6px; padding: 6px 10px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">RUN<em>DANCE</em></div>
  <div class="proto">P1 · BEAT</div>
</header>

<main>
  <section id="idle">
    <h1>Find the beat<br>in your feet</h1>
    <p>Put me in your hand or pocket and move — walk, jog, bounce. I'll show your steps-per-minute, live.</p>
    <button id="startBtn">START</button>
    <div class="err" id="err"></div>
  </section>

  <section id="live">
    <div id="pulse"></div>
    <div id="spm">—</div>
    <div id="spmLabel">STEPS / MIN</div>
    <canvas id="spark" width="840" height="112"></canvas>
    <div id="stats">
      <span>steps <b id="stepCount">0</b></span>
      <span>time <b id="clock">0:00</b></span>
      <span>signal <b id="hz">–</b></span>
    </div>
    <button id="stopBtn">STOP</button>
  </section>
</main>

<footer id="foot">motion stays on your phone · nothing is uploaded</footer>
<button id="demoBtn" hidden>demo</button>

<script>
'use strict';

/* ---------------- cadence estimation ----------------
   Autocorrelation over a sliding window of acceleration magnitude.
   More robust than naive peak counting: locks onto the periodicity
   of the gait signal, with a harmonic check so we report steps,
   not strides. */
const WINDOW_S = 5;          // analysis window
const MIN_SPM = 80, MAX_SPM = 240;
const ENERGY_GATE = 0.35;    // m/s^2 std-dev below which we call it "still"

const samples = [];          // {t (s), m (magnitude)}
let stepCount = 0;
let lastPeakT = -1;
let recentMean = 0, recentStd = 0;

function addSample(t, m) {
  samples.push({ t, m });
  while (samples.length && t - samples[0].t > WINDOW_S + 1) samples.shift();

  // lightweight per-step peak flash + counter (not the spm source)
  const n = samples.length;
  if (n > 4) {
    const a = samples[n - 3], b = samples[n - 2], c = samples[n - 1];
    if (b.m > a.m && b.m > c.m && b.m - recentMean > Math.max(0.6 * recentStd, 0.25)
        && (lastPeakT < 0 || b.t - lastPeakT > 0.24)) {
      lastPeakT = b.t;
      stepCount++;
      flashPulse();
    }
  }
}

function estimateSpm() {
  if (samples.length < 60) return null;
  const t1 = samples[samples.length - 1].t;
  const win = samples.filter(s => t1 - s.t <= WINDOW_S);
  if (win.length < 60 || t1 - win[0].t < 2.5) return null;

  // resample to uniform 50 Hz
  const RATE = 50, dt = 1 / RATE;
  const t0 = win[0].t, dur = t1 - t0, N = Math.floor(dur * RATE);
  const x = new Float32Array(N);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const tt = t0 + i * dt;
    while (j < win.length - 2 && win[j + 1].t < tt) j++;
    const a = win[j], b = win[j + 1];
    const f = b.t > a.t ? (tt - a.t) / (b.t - a.t) : 0;
    x[i] = a.m + (b.m - a.m) * f;
  }

  // demean, measure energy
  let mean = 0; for (let i = 0; i < N; i++) mean += x[i]; mean /= N;
  let varsum = 0;
  for (let i = 0; i < N; i++) { x[i] -= mean; varsum += x[i] * x[i]; }
  const std = Math.sqrt(varsum / N);
  recentMean = mean; recentStd = std;
  if (std < ENERGY_GATE) return { spm: null, still: true };

  // normalized autocorrelation over step-period lags
  const minLag = Math.floor(RATE * 60 / MAX_SPM);   // fastest cadence
  const maxLag = Math.ceil(RATE * 60 / MIN_SPM);    // slowest cadence
  if (N < maxLag * 2) return null;
  const ac = new Float32Array(maxLag + 1);
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0;
    for (let i = 0; i < N - lag; i++) s += x[i] * x[i + lag];
    ac[lag] = s / (varsum || 1);
  }
  let bestLag = -1, bestV = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    if (ac[lag] > bestV) { bestV = ac[lag]; bestLag = lag; }
  }
  if (bestLag < 0 || bestV < 0.25) return null;

  // harmonic check: if half the period is also strongly periodic,
  // we locked onto the stride — report the step instead.
  const half = Math.round(bestLag / 2);
  if (half >= minLag && ac[half] > 0.6 * bestV) bestLag = half;

  return { spm: 60 * RATE / bestLag, still: false, conf: bestV };
}

/* ---------------- UI ---------------- */
const $ = id => document.getElementById(id);
const idleEl = $('idle'), liveEl = $('live'), spmEl = $('spm');
const sparkEl = $('spark'), sctx = sparkEl.getContext('2d');
let smoothSpm = null, startTime = 0, sampleTimes = [], history = [];
let running = false, wakeLock = null;

function flashPulse() {
  const p = $('pulse');
  p.classList.add('hit');
  setTimeout(() => p.classList.remove('hit'), 90);
}

function onMotion(e) {
  const a = (e.acceleration && e.acceleration.x !== null) ? e.acceleration : e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  const t = performance.now() / 1000;
  addSample(t, Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z));
  sampleTimes.push(t);
  if (sampleTimes.length > 120) sampleTimes.shift();
}

function drawSpark() {
  const w = sparkEl.width, h = sparkEl.height;
  sctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  const lo = 70, hi = 220;
  sctx.beginPath();
  sctx.lineWidth = 4;
  sctx.strokeStyle = '#ff3d81';
  sctx.lineJoin = 'round';
  let started = false;
  const n = history.length, span = 60 * 1000; // 60s view
  const tNow = Date.now();
  for (let i = 0; i < n; i++) {
    const p = history[i];
    if (tNow - p.t > span) continue;
    const px = w - ((tNow - p.t) / span) * w;
    if (p.v === null) { started = false; continue; }
    const py = h - ((Math.min(Math.max(p.v, lo), hi) - lo) / (hi - lo)) * h;
    if (!started) { sctx.moveTo(px, py); started = true; }
    else sctx.lineTo(px, py);
  }
  sctx.stroke();
}

function tick() {
  if (!running) return;
  const est = estimateSpm();
  let display = null;
  if (est && est.spm) {
    smoothSpm = smoothSpm === null ? est.spm : smoothSpm * 0.7 + est.spm * 0.3;
    display = Math.round(smoothSpm);
  } else if (est && est.still) {
    smoothSpm = null;
  }
  spmEl.textContent = display !== null ? display : '—';
  spmEl.classList.toggle('idlebeat', display === null);
  history.push({ t: Date.now(), v: display });
  if (history.length > 400) history.shift();
  drawSpark();

  $('stepCount').textContent = stepCount;
  const el = Math.floor((performance.now() / 1000) - startTime);
  $('clock').textContent = Math.floor(el / 60) + ':' + String(el % 60).padStart(2, '0');
  const st = sampleTimes;
  $('hz').textContent = st.length > 10 ? Math.round((st.length - 1) / (st[st.length - 1] - st[0])) + ' Hz' : '–';

  setTimeout(tick, 300);
}

async function start() {
  $('err').textContent = '';
  if (!window.isSecureContext) {
    $('err').textContent = 'Motion needs a secure (https) page — open the https link.';
    return;
  }
  if (typeof DeviceMotionEvent === 'undefined') {
    $('err').textContent = 'This browser has no motion sensor access.';
    return;
  }
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== 'granted') { $('err').textContent = 'Motion permission was declined. Reload to try again.'; return; }
    }
  } catch (e) {
    $('err').textContent = 'Motion permission failed: ' + e.message;
    return;
  }
  window.addEventListener('devicemotion', onMotion);
  goLive();
}

function goLive() {
  idleEl.style.display = 'none';
  liveEl.style.display = 'flex';
  running = true;
  startTime = performance.now() / 1000;
  stepCount = 0; history = []; smoothSpm = null;
  requestWake();
  tick();
}

async function requestWake() {
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
  } catch (e) { /* fine — worst case screen dims */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) requestWake();
});

function stop() {
  running = false;
  window.removeEventListener('devicemotion', onMotion);
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  wakeLock?.release().catch(() => {});
  liveEl.style.display = 'none';
  idleEl.style.display = 'flex';
}

$('startBtn').addEventListener('click', start);
$('stopBtn').addEventListener('click', stop);

/* ---------------- demo signal (desktop testing) ---------------- */
let demoTimer = null;
const isTouch = 'ontouchstart' in window;
if (!isTouch) $('demoBtn').hidden = false;
$('demoBtn').addEventListener('click', () => {
  if (demoTimer) return;
  // Generate a 50 Hz synthetic gait signal. Robust to timer throttling:
  // each tick emits however many samples wall-clock says are due, so the
  // signal stays correct even if the browser clamps setInterval.
  const DEMO_DT = 0.02;
  let phase = 0;
  const startT = performance.now() / 1000;
  let emittedUntil = startT;
  demoTimer = setInterval(() => {
    const now = performance.now() / 1000;
    let n = 0;
    while (emittedUntil + DEMO_DT <= now && n < 300) {
      emittedUntil += DEMO_DT; n++;
      const t = emittedUntil - startT;
      // wandering cadence: 162 spm baseline, slow drift, "standing still" at 20-25s
      const spm = 162 + 6 * Math.sin(t / 9);
      phase += 2 * Math.PI * (spm / 60) * DEMO_DT;
      const still = t > 20 && t < 25;
      const m = still
        ? 0.05 * (Math.random() - 0.5)
        : Math.sin(phase) * 2.2 + Math.sin(2 * phase) * 0.7 + (Math.random() - 0.5) * 0.6;
      addSample(emittedUntil, 9.81 + m);
      sampleTimes.push(emittedUntil);
      if (sampleTimes.length > 120) sampleTimes.shift();
    }
  }, 40);
  goLive();
});
</script>
</body>
</html>
