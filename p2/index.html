<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RunDance · Floor</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #f4f2ef;
    --dim: #6b6878;
    --hot: #ff3d81;
    --warm: #ffb03d;
    --cool: #3dd6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 0.5s;
  }
  body.locked  { background: #1c0714; }
  body.close   { background: #170f06; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 24px 0; }
  .brand { font-weight: 800; letter-spacing: 0.16em; font-size: 14px; }
  .brand em { font-style: normal; color: var(--hot); }
  .proto { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; }

  /* setup screen */
  #setup { display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
  #setup h1 { font-size: 28px; font-weight: 800; line-height: 1.25; }
  #setup p { color: var(--dim); font-size: 15px; line-height: 1.5; max-width: 310px; }
  .tempoRow { display: flex; gap: 18px; }
  .tempoBtn {
    font: inherit; font-weight: 800; color: var(--ink);
    background: #15131d; border: 1px solid #2a2836; border-radius: 22px;
    padding: 26px 34px; text-align: center;
  }
  .tempoBtn .big { display: block; font-size: 44px; line-height: 1; }
  .tempoBtn .sub { display: block; color: var(--dim); font-size: 11px; letter-spacing: 0.1em; margin-top: 8px; }
  .tempoBtn:active { border-color: var(--hot); }
  .err { color: var(--warm); font-size: 13px; max-width: 300px; }

  /* floor screen */
  #floor { display: none; flex-direction: column; align-items: center; width: 100%; }
  #beatDot {
    width: 16px; height: 16px; border-radius: 50%;
    background: #262331; margin-bottom: 4px;
    transition: transform 0.05s, background 0.05s;
  }
  #beatDot.tick { background: var(--warm); transform: scale(1.8); box-shadow: 0 0 26px var(--warm); }
  #state { font-size: 15px; font-weight: 800; letter-spacing: 0.3em; color: var(--dim); margin: 10px 0 2px; min-height: 20px; }
  body.locked #state { color: var(--hot); text-shadow: 0 0 18px rgba(255,61,129,0.6); }
  body.close  #state { color: var(--warm); }
  #spm {
    font-size: min(36vw, 158px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  #spm.faded { color: var(--dim); }
  #spmLabel { color: var(--dim); letter-spacing: 0.28em; font-size: 12px; margin-top: 2px; }
  #tuner { display: flex; align-items: center; gap: 20px; margin-top: 30px; }
  .tuneBtn {
    font: inherit; font-size: 22px; font-weight: 700; color: var(--ink);
    width: 54px; height: 54px; border-radius: 50%;
    background: #15131d; border: 1px solid #2a2836;
  }
  .tuneBtn:active { border-color: var(--hot); }
  #beatInfo { text-align: center; }
  #bpmNow { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #beatInfo .sub { color: var(--dim); font-size: 10px; letter-spacing: 0.16em; }
  #stats { display: flex; gap: 26px; margin-top: 22px; color: var(--dim); font-size: 12px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  #stats b { color: var(--ink); font-weight: 600; }
  #stopBtn {
    margin-top: 28px; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.12em;
    color: var(--dim); background: none; border: 1px solid #2a2836; border-radius: 999px; padding: 10px 28px;
  }
  footer { text-align: center; color: #3c3948; font-size: 10px; padding: 14px; letter-spacing: 0.06em; }
  #demoBtn {
    position: fixed; right: 14px; bottom: 14px; font-size: 10px; color: var(--dim);
    background: none; border: 1px dashed #2a2836; border-radius: 6px; padding: 6px 10px;
  }
  @media (prefers-reduced-motion: reduce) {
    body, #beatDot { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">RUN<em>DANCE</em></div>
  <div class="proto">P2 · FLOOR</div>
</header>

<main>
  <section id="setup">
    <h1>Step onto<br>the floor</h1>
    <p>I'll drop a beat. Your only job: land your feet on it. Pick your groove — you can fine-tune it live.</p>
    <div class="tempoRow">
      <button class="tempoBtn" data-bpm="80"><span class="big">80</span><span class="sub">HALF-TIME GROOVE</span></button>
      <button class="tempoBtn" data-bpm="160"><span class="big">160</span><span class="sub">FOUR ON THE FLOOR</span></button>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section id="floor">
    <div id="beatDot"></div>
    <div id="state">DROP IN</div>
    <div id="spm" class="faded">—</div>
    <div id="spmLabel">YOUR FEET · STEPS/MIN</div>
    <div id="tuner">
      <button class="tuneBtn" id="down">−</button>
      <div id="beatInfo">
        <div id="bpmNow">160</div>
        <div class="sub">BEAT · BPM</div>
      </div>
      <button class="tuneBtn" id="up">+</button>
    </div>
    <div id="stats">
      <span>locked <b id="lockPct">0%</b></span>
      <span>time <b id="clock">0:00</b></span>
      <span>steps <b id="stepCount">0</b></span>
    </div>
    <button id="stopBtn">LEAVE THE FLOOR</button>
  </section>
</main>

<footer>motion &amp; sound stay on your phone · nothing is uploaded</footer>
<button id="demoBtn" hidden>demo</button>

<script>
'use strict';

/* ================= cadence estimation (from P1, validated) ================= */
const WINDOW_S = 5, MIN_SPM = 80, MAX_SPM = 240, ENERGY_GATE = 0.35;
const samples = [];
let stepCount = 0, lastPeakT = -1, recentMean = 0, recentStd = 0;

function addSample(t, m) {
  samples.push({ t, m });
  while (samples.length && t - samples[0].t > WINDOW_S + 1) samples.shift();
  const n = samples.length;
  if (n > 4) {
    const a = samples[n - 3], b = samples[n - 2], c = samples[n - 1];
    if (b.m > a.m && b.m > c.m && b.m - recentMean > Math.max(0.6 * recentStd, 0.25)
        && (lastPeakT < 0 || b.t - lastPeakT > 0.24)) {
      lastPeakT = b.t; stepCount++;
    }
  }
}

function estimateSpm() {
  if (samples.length < 60) return null;
  const t1 = samples[samples.length - 1].t;
  const win = samples.filter(s => t1 - s.t <= WINDOW_S);
  if (win.length < 60 || t1 - win[0].t < 2.5) return null;
  const RATE = 50, dt = 1 / RATE;
  const t0 = win[0].t, N = Math.floor((t1 - t0) * RATE);
  const x = new Float32Array(N);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const tt = t0 + i * dt;
    while (j < win.length - 2 && win[j + 1].t < tt) j++;
    const a = win[j], b = win[j + 1];
    const f = b.t > a.t ? (tt - a.t) / (b.t - a.t) : 0;
    x[i] = a.m + (b.m - a.m) * f;
  }
  let mean = 0; for (let i = 0; i < N; i++) mean += x[i]; mean /= N;
  let varsum = 0;
  for (let i = 0; i < N; i++) { x[i] -= mean; varsum += x[i] * x[i]; }
  const std = Math.sqrt(varsum / N);
  recentMean = mean; recentStd = std;
  if (std < ENERGY_GATE) return { spm: null, still: true };
  const minLag = Math.floor(RATE * 60 / MAX_SPM), maxLag = Math.ceil(RATE * 60 / MIN_SPM);
  if (N < maxLag * 2) return null;
  const ac = new Float32Array(maxLag + 1);
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0;
    for (let i = 0; i < N - lag; i++) s += x[i] * x[i + lag];
    ac[lag] = s / (varsum || 1);
  }
  let bestLag = -1, bestV = 0;
  for (let lag = minLag; lag <= maxLag; lag++) if (ac[lag] > bestV) { bestV = ac[lag]; bestLag = lag; }
  if (bestLag < 0 || bestV < 0.25) return null;
  const half = Math.round(bestLag / 2);
  if (half >= minLag && ac[half] > 0.6 * bestV) bestLag = half;
  return { spm: 60 * RATE / bestLag, still: false };
}

/* ================= the beat (WebAudio club kit) =================
   Lookahead scheduler for sample-accurate timing. Kick on every beat;
   in half-time (bpm < 120) hats mark the off-beats so your 2-steps-
   per-beat grid stays audible. */
let actx = null, bpm = 160, nextBeatT = 0, beatIndex = 0, schedTimer = null;
const scheduledBeats = [];   // audio-clock times, for the visual dot

function makeKick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(155, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.11);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + 0.26);
}
let noiseBuf = null;
function makeHat(t, loud) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.06, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf;
  f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(loud ? 0.22 : 0.13, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(t);
}

function scheduler() {
  const ahead = 0.12;
  while (nextBeatT < actx.currentTime + ahead) {
    makeKick(nextBeatT);
    scheduledBeats.push(nextBeatT);
    const period = 60 / bpm;
    if (bpm < 120) {
      makeHat(nextBeatT + period / 2, true);   // off-beat = the other footfall
    } else if (beatIndex % 2 === 1) {
      makeHat(nextBeatT + period / 2, false);  // light 8th sizzle
    }
    nextBeatT += period;
    beatIndex++;
  }
  while (scheduledBeats.length && scheduledBeats[0] < actx.currentTime - 0.5) scheduledBeats.shift();
}

function startBeat() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  nextBeatT = actx.currentTime + 0.1;
  beatIndex = 0;
  schedTimer = setInterval(scheduler, 25);
}
function stopBeat() {
  if (schedTimer) clearInterval(schedTimer);
  schedTimer = null;
  if (actx) actx.close().catch(() => {});
  actx = null;
}

/* visual beat dot, synced to the audio clock */
function beatDotLoop() {
  if (!running) return;
  if (actx && scheduledBeats.length) {
    const now = actx.currentTime;
    for (const bt of scheduledBeats) {
      if (now >= bt && now - bt < 0.09) { dotEl.classList.add('tick'); break; }
      if (bt > now) { dotEl.classList.remove('tick'); break; }
    }
    if (now - (scheduledBeats.find(b => b <= now) ?? 0) >= 0.09) dotEl.classList.remove('tick');
  }
  requestAnimationFrame(beatDotLoop);
}

/* ================= lock logic ================= */
function stepTarget() { return bpm < 120 ? bpm * 2 : bpm; }
// deviation of feet from the step grid, allowing half/double interpretation
function gridDelta(spm) {
  const t = stepTarget();
  const cands = [spm, spm * 2, spm / 2];
  let best = Infinity;
  for (const c of cands) if (Math.abs(c - t) < Math.abs(best)) best = c - t;
  return best;
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const setupEl = $('setup'), floorEl = $('floor'), spmEl = $('spm'), dotEl = $('beatDot');
let smoothSpm = null, startTime = 0, history = [];
let running = false, wakeLock = null;
let lockedTicks = 0, totalTicks = 0;

function onMotion(e) {
  const a = (e.acceleration && e.acceleration.x !== null) ? e.acceleration : e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  addSample(performance.now() / 1000, Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z));
}

function tick() {
  if (!running) return;
  const est = estimateSpm();
  let display = null;
  if (est && est.spm) {
    smoothSpm = smoothSpm === null ? est.spm : smoothSpm * 0.7 + est.spm * 0.3;
    display = Math.round(smoothSpm);
  } else if (est && est.still) smoothSpm = null;

  spmEl.textContent = display !== null ? display : '—';
  spmEl.classList.toggle('faded', display === null);

  // lock state → body class + party words
  document.body.classList.remove('locked', 'close');
  let word = 'DROP IN';
  if (display !== null) {
    totalTicks++;
    const d = Math.abs(gridDelta(display));
    if (d <= 3)      { document.body.classList.add('locked'); word = 'IN THE POCKET'; lockedTicks++; }
    else if (d <= 8) { document.body.classList.add('close');  word = gridDelta(display) > 0 ? 'EASE OFF' : 'PICK IT UP'; }
    else             { word = 'FIND THE BEAT'; }
  } else if (est && est.still) word = 'MOVE WITH IT';
  $('state').textContent = word;

  $('lockPct').textContent = totalTicks ? Math.round(100 * lockedTicks / totalTicks) + '%' : '0%';
  $('stepCount').textContent = stepCount;
  const el = Math.floor((performance.now() / 1000) - startTime);
  $('clock').textContent = Math.floor(el / 60) + ':' + String(el % 60).padStart(2, '0');

  setTimeout(tick, 300);
}

async function enterFloor(chosenBpm, withMotion) {
  $('err').textContent = '';
  bpm = chosenBpm;
  if (withMotion) {
    if (!window.isSecureContext) { $('err').textContent = 'Needs the https link.'; return; }
    if (typeof DeviceMotionEvent === 'undefined') { $('err').textContent = 'No motion sensors here.'; return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== 'granted') { $('err').textContent = 'Motion permission declined — reload to try again.'; return; }
      }
    } catch (e) { $('err').textContent = 'Motion permission failed: ' + e.message; return; }
    window.addEventListener('devicemotion', onMotion);
  }
  startBeat();
  setupEl.style.display = 'none';
  floorEl.style.display = 'flex';
  running = true;
  startTime = performance.now() / 1000;
  stepCount = 0; smoothSpm = null; lockedTicks = 0; totalTicks = 0;
  $('bpmNow').textContent = bpm;
  requestWake();
  tick();
  beatDotLoop();
}

async function requestWake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) requestWake();
});

function leaveFloor() {
  running = false;
  stopBeat();
  window.removeEventListener('devicemotion', onMotion);
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  wakeLock?.release().catch(() => {});
  document.body.classList.remove('locked', 'close');
  floorEl.style.display = 'none';
  setupEl.style.display = 'flex';
}

document.querySelectorAll('.tempoBtn').forEach(b =>
  b.addEventListener('click', () => enterFloor(parseInt(b.dataset.bpm, 10), true)));
$('stopBtn').addEventListener('click', leaveFloor);
$('up').addEventListener('click', () => { bpm = Math.min(200, bpm + 1); $('bpmNow').textContent = bpm; });
$('down').addEventListener('click', () => { bpm = Math.max(60, bpm - 1); $('bpmNow').textContent = bpm; });

/* ================= demo (desktop) ================= */
let demoTimer = null;
if (!('ontouchstart' in window)) $('demoBtn').hidden = false;
$('demoBtn').addEventListener('click', () => {
  if (demoTimer) return;
  const DEMO_DT = 0.02;
  let phase = 0;
  const startT = performance.now() / 1000;
  let emittedUntil = startT;
  demoTimer = setInterval(() => {
    const now = performance.now() / 1000;
    let n = 0;
    while (emittedUntil + DEMO_DT <= now && n < 300) {
      emittedUntil += DEMO_DT; n++;
      const t = emittedUntil - startT;
      // runner searching for the beat: starts at 150, converges to 160, overshoots
      const spm = 160 + 10 * Math.exp(-t / 8) * Math.cos(t / 2.5) - 10 * Math.exp(-t / 8);
      phase += 2 * Math.PI * (spm / 60) * DEMO_DT;
      const m = Math.sin(phase) * 2.2 + Math.sin(2 * phase) * 0.7 + (Math.random() - 0.5) * 0.6;
      addSample(emittedUntil, 9.81 + m);
    }
  }, 40);
  enterFloor(160, false);
});
</script>
</body>
</html>
