<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>rundance</title>
<style>
  /* ————— paper, ink, one red —————
     After Hara: the page is emptiness; the number is the object.
     One accent, used only when the body earns it. */
  :root {
    --paper: #ffffff;
    --ink: #1d1d1b;
    --faint: #b0b0a8;
    --line: #ededea;
    --red: #b3282d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 34px 0 0; text-align: center; }
  .brand { font-weight: 300; letter-spacing: 0.42em; font-size: 11px; color: var(--ink); text-transform: lowercase; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px 28px; width: 100%; max-width: 480px; margin: 0 auto; }
  section { width: 100%; }

  /* ————— gate ————— */
  #gate { display: flex; flex-direction: column; align-items: center; text-align: center; }
  #gate .word { font-size: 15px; font-weight: 300; color: var(--faint); letter-spacing: 0.06em; line-height: 2; max-width: 250px; }
  #runBtn {
    margin: 64px 0 56px;
    width: 148px; height: 148px; border-radius: 50%;
    font: inherit; font-size: 15px; font-weight: 300; letter-spacing: 0.34em; text-indent: 0.34em;
    color: var(--ink); background: none; border: 1px solid var(--ink);
    transition: color 0.4s, border-color 0.4s;
  }
  #runBtn:active { color: var(--red); border-color: var(--red); }
  #poolLine { font-size: 11px; font-weight: 300; color: var(--faint); letter-spacing: 0.1em; min-height: 16px; }
  .err { color: var(--red); font-size: 12px; font-weight: 300; max-width: 300px; line-height: 1.8; margin-top: 18px; }
  .err a { color: var(--red); }

  /* ————— stride ————— */
  #stride { display: none; flex-direction: column; align-items: center; text-align: center; }
  .quiet { font-size: 11px; font-weight: 300; letter-spacing: 0.3em; color: var(--faint); text-transform: lowercase; }
  #strideSpm { font-size: min(40vw, 170px); font-weight: 100; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 26px 0 4px; }
  #strideSpm.faded { color: var(--line); }
  #strideHint { font-size: 12px; font-weight: 300; color: var(--faint); letter-spacing: 0.08em; min-height: 16px; }
  #slider {
    width: min(74vw, 320px); margin-top: 54px;
    accent-color: var(--ink); height: 2px;
  }
  #lockNowBtn {
    margin-top: 34px; font: inherit; font-size: 12px; font-weight: 300; letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 14px 40px;
  }
  #lockNowBtn:active { border-color: var(--ink); }

  /* ————— floor ————— */
  #floor { display: none; flex-direction: column; align-items: center; }
  #state { font-size: 12px; font-weight: 300; letter-spacing: 0.34em; text-indent: 0.34em; color: var(--faint); min-height: 18px; text-transform: lowercase; text-align: center; }
  #state.instep { color: var(--red); }
  #state.near { color: var(--ink); }
  #spm { font-size: min(36vw, 156px); font-weight: 100; line-height: 1.1; font-variant-numeric: tabular-nums; text-align: center; margin: 14px 0 2px; }
  #spm.faded { color: var(--line); }
  #spmSub { font-size: 10px; font-weight: 300; letter-spacing: 0.26em; color: var(--faint); text-align: center; text-transform: lowercase; }

  .block { width: 100%; border-top: 1px solid var(--line); margin-top: 34px; padding-top: 14px; }
  .blockTitle { font-size: 9px; font-weight: 400; letter-spacing: 0.3em; color: var(--faint); text-transform: lowercase; margin-bottom: 8px; }
  #nowTrack { font-size: 14px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nowArtist { color: var(--faint); font-size: 12px; font-weight: 300; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nowBeat { font-size: 10px; font-weight: 300; color: var(--faint); margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }

  .discRow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .discRow:last-child { border-bottom: none; }
  .dLeft { min-width: 0; flex: 1; }
  .dName { font-size: 13px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dArtist { color: var(--faint); font-size: 11px; font-weight: 300; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qBtn {
    font: inherit; font-size: 15px; font-weight: 300; color: var(--ink); flex: none;
    width: 34px; height: 34px; border-radius: 50%;
    background: none; border: 1px solid var(--line);
  }
  .qBtn.done { color: var(--red); border-color: var(--red); }
  #moreDisc { font: inherit; font-size: 10px; font-weight: 300; letter-spacing: 0.24em; color: var(--faint); background: none; border: none; padding: 10px 0 0; text-transform: lowercase; }

  #controls { display: flex; gap: 40px; margin-top: 36px; justify-content: center; }
  .tBtn {
    font: inherit; font-size: 11px; font-weight: 300; letter-spacing: 0.28em; text-indent: 0.28em;
    color: var(--ink); background: none; border: none; padding: 8px 0; text-transform: lowercase;
  }
  .tBtn:active { color: var(--red); }
  #stats { display: flex; gap: 34px; margin-top: 26px; color: var(--faint); font-size: 10px; font-weight: 300; letter-spacing: 0.18em; font-variant-numeric: tabular-nums; justify-content: center; text-transform: lowercase; }
  #stats b { color: var(--ink); font-weight: 400; }
  #windBtn, #stopBtn {
    font: inherit; font-size: 10px; font-weight: 300; letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--faint); background: none; border: none; text-transform: lowercase; padding: 6px;
  }
  #endRow { display: flex; gap: 30px; margin-top: 30px; justify-content: center; }
  footer { text-align: center; color: var(--faint); font-size: 9px; font-weight: 300; padding: 16px; letter-spacing: 0.24em; text-transform: lowercase; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header><div class="brand">rundance</div></header>

<main>
  <section id="gate">
    <div class="word">nothing to set.<br>your stride finds its rhythm,<br>and your music follows.</div>
    <button id="runBtn">run</button>
    <div id="poolLine"></div>
    <div class="err" id="err"></div>
  </section>

  <section id="stride">
    <div class="quiet">finding your stride</div>
    <div id="strideSpm" class="faded">—</div>
    <div id="strideHint">keep going</div>
    <input type="range" id="slider" min="130" max="200" value="160">
    <button id="lockNowBtn">begin at <span id="lockNum">—</span></button>
  </section>

  <section id="floor">
    <div id="state">settle in</div>
    <div id="spm" class="faded">—</div>
    <div id="spmSub">steps each minute · with <span id="targetShow">–</span></div>

    <div class="block">
      <div class="blockTitle">now playing</div>
      <div id="nowTrack">…</div>
      <div id="nowArtist"></div>
      <div id="nowBeat"></div>
    </div>

    <div class="block" id="discCard" style="display:none">
      <div class="blockTitle">new, at your pace</div>
      <div id="discList"></div>
      <button id="moreDisc">a few more</button>
    </div>

    <div id="controls">
      <button class="tBtn" id="pauseBtn">pause</button>
      <button class="tBtn" id="skipBtn">next</button>
    </div>
    <div id="stats">
      <span>in step <b id="lockPct">–</b></span>
      <span><b id="clock">0:00</b></span>
    </div>
    <div id="endRow">
      <button id="windBtn">wind down</button>
      <button id="stopBtn">finish</button>
    </div>
  </section>
</main>

<footer>only to run</footer>

<script>
'use strict';

/* ============ auth (shared, same origin) ============ */
const CLIENT_ID = '1ef4c2f856ac4bafa74cce2d2bd89c94';
const TOKEN_URL = 'https://accounts.spotify.com/api/token';
const RB = 'https://api.reccobeats.com/v1';
const $ = id => document.getElementById(id);

const store = {
  get access()  { return localStorage.getItem('rd_access'); },
  get refresh() { return localStorage.getItem('rd_refresh'); },
  get expires() { return parseInt(localStorage.getItem('rd_expires') || '0', 10); },
  save(tok) {
    localStorage.setItem('rd_access', tok.access_token);
    if (tok.refresh_token) localStorage.setItem('rd_refresh', tok.refresh_token);
    localStorage.setItem('rd_expires', String(Date.now() + (tok.expires_in - 60) * 1000));
  },
};
async function ensureToken() {
  if (store.access && Date.now() < store.expires) return store.access;
  if (store.refresh) {
    const res = await fetch(TOKEN_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: store.refresh, client_id: CLIENT_ID }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { store.save(data); return store.access; }
  }
  return null;
}
async function spotify(path, opts = {}) {
  const token = await ensureToken();
  if (!token) throw new Error('NOT_CONNECTED');
  const init = { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token } };
  if (opts.body) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  const res = await fetch('https://api.spotify.com/v1' + path, init);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) { const e = new Error(data?.error?.message || ('http ' + res.status)); e.status = res.status; throw e; }
  return data;
}

/* ============ waking the decks ============
   "No active device" just means Spotify dozed off. Find any known
   device and address it directly; only ask the runner as a last resort. */
async function playUris(uris) {
  try {
    await spotify('/me/player/play', { method: 'PUT', body: { uris } });
    return true;
  } catch (e) {
    if (!(e.status === 404 || /no active device/i.test(e.message))) throw e;
  }
  const d = await spotify('/me/player/devices').catch(() => null);
  const devs = d?.devices || [];
  const dev = devs.find(x => x.type === 'Smartphone') || devs[0];
  if (dev) {
    await spotify('/me/player/play?device_id=' + encodeURIComponent(dev.id), { method: 'PUT', body: { uris } });
    return true;
  }
  return false;   // truly asleep — needs one human touch
}

/* ============ library + taste ============ */
let cache = {}, library = [], topRank = new Map();

async function loadLibrary() {
  try { cache = JSON.parse(localStorage.getItem('rd_bpm_cache') || '{}'); } catch (e) {}
  if (!Object.keys(cache).length) {
    $('err').innerHTML = 'one small thing first — a <a href="../p4/">quiet look at your songs</a>. once, then never again.';
    return false;
  }
  let offset = 0, total = null;
  while (total === null || offset < total) {
    const page = await spotify('/me/tracks?limit=50&offset=' + offset);
    total = page.total;
    for (const it of page.items) if (it.track && cache[it.track.id])
      library.push({ id: it.track.id, name: it.track.name,
        artists: it.track.artists.map(a => a.name).join(', '),
        tempo: cache[it.track.id].tempo, energy: cache[it.track.id].energy ?? 0.5 });
    offset += 50;
    $('poolLine').textContent = 'listening to your library · ' + Math.min(offset, total) + ' of ' + total;
  }
  try {
    const top = await spotify('/me/top/tracks?limit=50&time_range=medium_term');
    (top.items || []).forEach((t, i) => topRank.set(t.id, 50 - i));
  } catch (e) { /* quietly optional */ }
  $('poolLine').textContent = library.length + ' songs know your name';
  return true;
}

function stepGridOf(tempo) {
  let s = tempo;
  while (s < 110) s *= 2;
  while (s >= 220) s /= 2;
  return s;
}

/* the set: begins a breath below your number, rises to it.
   a dj never says "warmup" — the room just gets warmer. */
function buildSet(target) {
  const all = library
    .map(t => ({ ...t, grid: stepGridOf(t.tempo) }))
    .filter(t => Math.abs(t.grid - target) <= target * 0.06);
  if (all.length < 3) return all.sort((a, b) => Math.abs(a.grid - target) - Math.abs(b.grid - target));

  const score = t => Math.abs(t.grid - target) - (topRank.get(t.id) || 0) * 0.05;
  const below = all.filter(t => t.grid < target - 1).sort((a, b) => (a.grid - b.grid) || (a.energy - b.energy));
  const openers = below.slice(0, 3).sort((a, b) => a.grid - b.grid || a.energy - b.energy);
  const rest = all.filter(t => !openers.includes(t)).sort((a, b) => score(a) - score(b));
  return [...openers, ...rest];
}

/* ============ cadence (validated core) ============ */
const WINDOW_S = 5, MIN_SPM = 80, MAX_SPM = 240, ENERGY_GATE = 0.35;
const samples = [];
function addSample(t, m) {
  samples.push({ t, m });
  while (samples.length && t - samples[0].t > WINDOW_S + 1) samples.shift();
}
function estimateSpm() {
  if (samples.length < 60) return null;
  const t1 = samples[samples.length - 1].t;
  const win = samples.filter(s => t1 - s.t <= WINDOW_S);
  if (win.length < 60 || t1 - win[0].t < 2.5) return null;
  const RATE = 50, dt = 1 / RATE;
  const t0 = win[0].t, N = Math.floor((t1 - t0) * RATE);
  const x = new Float32Array(N);
  let j = 0;
  for (let i = 0; i < N; i++) {
    const tt = t0 + i * dt;
    while (j < win.length - 2 && win[j + 1].t < tt) j++;
    const a = win[j], b = win[j + 1];
    const f = b.t > a.t ? (tt - a.t) / (b.t - a.t) : 0;
    x[i] = a.m + (b.m - a.m) * f;
  }
  let mean = 0; for (let i = 0; i < N; i++) mean += x[i]; mean /= N;
  let varsum = 0;
  for (let i = 0; i < N; i++) { x[i] -= mean; varsum += x[i] * x[i]; }
  if (Math.sqrt(varsum / N) < ENERGY_GATE) return { spm: null, still: true };
  const minLag = Math.floor(RATE * 60 / MAX_SPM), maxLag = Math.ceil(RATE * 60 / MIN_SPM);
  if (N < maxLag * 2) return null;
  const ac = new Float32Array(maxLag + 1);
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0;
    for (let i = 0; i < N - lag; i++) s += x[i] * x[i + lag];
    ac[lag] = s / (varsum || 1);
  }
  let bestLag = -1, bestV = 0;
  for (let lag = minLag; lag <= maxLag; lag++) if (ac[lag] > bestV) { bestV = ac[lag]; bestLag = lag; }
  if (bestLag < 0 || bestV < 0.25) return null;
  const half = Math.round(bestLag / 2);
  if (half >= minLag && ac[half] > 0.6 * bestV) bestLag = half;
  return { spm: 60 * RATE / bestLag, still: false };
}
function onMotion(e) {
  const a = (e.acceleration && e.acceleration.x !== null) ? e.acceleration : e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  addSample(performance.now() / 1000, Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z));
}

/* ============ flow ============ */
let phase = 'gate', target = 160, smoothSpm = null;
let running = false, wakeLock = null, startTime = 0, lockedTicks = 0, totalTicks = 0;
let nowStepGrid = null, stableSince = null, sliderTouched = false;

async function startRun() {
  $('err').textContent = '';
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== 'granted') { $('err').textContent = 'the phone kept its sensors to itself — reload to ask again.'; return; }
    } catch (e) { $('err').textContent = 'motion: ' + e.message; return; }
  }
  window.addEventListener('devicemotion', onMotion);
  phase = 'stride';
  $('gate').style.display = 'none';
  $('stride').style.display = 'flex';
  requestWake();
  strideTick();
}

function strideTick() {
  if (phase !== 'stride') return;
  const est = estimateSpm();
  if (est && est.spm) {
    smoothSpm = smoothSpm === null ? est.spm : smoothSpm * 0.7 + est.spm * 0.3;
    const n = Math.round(smoothSpm);
    $('strideSpm').textContent = n;
    $('strideSpm').classList.remove('faded');
    if (!sliderTouched) { $('slider').value = n; $('lockNum').textContent = n; }
    if (Math.abs(smoothSpm - parseInt($('slider').value, 10)) <= 3 && !sliderTouched) {
      if (!stableSince) stableSince = performance.now();
      else if (performance.now() - stableSince > 8000) { lockTarget(); return; }
    } else stableSince = null;
    $('strideHint').textContent = stableSince ? 'yes — this one' : 'keep going';
  } else {
    $('strideSpm').textContent = '—';
    $('strideSpm').classList.add('faded');
    stableSince = null;
    $('strideHint').textContent = 'keep going';
  }
  setTimeout(strideTick, 300);
}

let currentSet = [];
async function lockTarget() {
  target = parseInt($('slider').value, 10);
  phase = 'floor';
  currentSet = buildSet(target);
  if (currentSet.length < 3) { backToGate('too few songs near ' + target + ' — another pace, perhaps.'); return; }
  await beginPlayback(currentSet);
}

async function beginPlayback(set) {
  try {
    const ok = await playUris(set.slice(0, 50).map(t => 'spotify:track:' + t.id));
    if (!ok) {
      // Spotify is fully asleep — one human touch, then we retry by ourselves
      backToGate('');
      $('err').innerHTML = 'spotify is asleep. <a href="spotify://">open it</a>, let it breathe, come back — I\'ll be trying.';
      retryWake(set);
      return;
    }
  } catch (e) { backToGate('the decks said: ' + e.message); return; }

  $('stride').style.display = 'none';
  $('floor').style.display = 'flex';
  $('targetShow').textContent = target;
  running = true;
  startTime = performance.now() / 1000;
  lockedTicks = 0; totalTicks = 0;
  floorTick();
  pollPlayer();
  discover(true);
}

let wakeTries = 0;
function retryWake(set) {
  wakeTries = 0;
  const attempt = async () => {
    if (phase === 'floor' || wakeTries++ > 15) return;
    const ok = await playUris(set.slice(0, 50).map(t => 'spotify:track:' + t.id)).catch(() => false);
    if (ok) { phase = 'floor'; $('err').textContent = ''; $('gate').style.display = 'none'; await beginPlayback(set); return; }
    setTimeout(attempt, 2500);
  };
  setTimeout(attempt, 2500);
}

function backToGate(msg) {
  phase = 'gate'; running = false;
  window.removeEventListener('devicemotion', onMotion);
  $('stride').style.display = 'none';
  $('floor').style.display = 'none';
  $('gate').style.display = 'flex';
  $('err').textContent = msg || '';
}

let pollTimer = null;
async function pollPlayer() {
  if (!running) return;
  try {
    const p = await spotify('/me/player');
    if (p && p.item) {
      $('nowTrack').textContent = p.item.name;
      $('nowArtist').textContent = p.item.artists.map(a => a.name).join(', ');
      const known = cache[p.item.id];
      nowStepGrid = known ? stepGridOf(known.tempo) : null;
      $('nowBeat').textContent = known
        ? (Math.round(known.tempo * 10) / 10) + ' · your feet at ' + Math.round(nowStepGrid)
        : 'a new one — ride it';
    }
  } catch (e) { /* transient */ }
  pollTimer = setTimeout(pollPlayer, 4000);
}

function gridDelta(spm, grid) {
  const cands = [spm, spm * 2, spm / 2];
  let best = Infinity;
  for (const c of cands) if (Math.abs(c - grid) < Math.abs(best)) best = c - grid;
  return best;
}

function floorTick() {
  if (!running) return;
  const est = estimateSpm();
  let display = null;
  if (est && est.spm) {
    smoothSpm = smoothSpm === null ? est.spm : smoothSpm * 0.7 + est.spm * 0.3;
    display = Math.round(smoothSpm);
  } else if (est && est.still) smoothSpm = null;

  $('spm').textContent = display !== null ? display : '—';
  $('spm').classList.toggle('faded', display === null);

  const st = $('state');
  st.classList.remove('instep', 'near');
  let word = 'settle in';
  const grid = nowStepGrid || target;
  if (display !== null) {
    totalTicks++;
    const d = gridDelta(display, grid);
    if (Math.abs(d) <= 3)      { st.classList.add('instep'); word = 'in step'; lockedTicks++; }
    else if (Math.abs(d) <= 8) { st.classList.add('near');   word = d > 0 ? 'softer' : 'a little quicker'; }
    else                       { word = 'listen for it'; }
  } else if (est && est.still) word = 'move';
  st.textContent = word;

  $('lockPct').textContent = totalTicks ? Math.round(100 * lockedTicks / totalTicks) + '%' : '–';
  const el = Math.floor((performance.now() / 1000) - startTime);
  $('clock').textContent = Math.floor(el / 60) + ':' + String(el % 60).padStart(2, '0');
  setTimeout(floorTick, 300);
}

/* ============ new, at your pace — the pool grows ============ */
let discSeen = new Set(), discSeedShift = 0;
async function discover(fresh) {
  try {
    if (fresh) { discSeen = new Set(); discSeedShift = 0; $('discList').innerHTML = ''; }
    const seedsPool = currentSet.slice(discSeedShift, discSeedShift + 5);
    discSeedShift += 5;
    if (!seedsPool.length) return;
    const r = await fetch(RB + '/track?ids=' + seedsPool.map(t => t.id).join(','));
    if (!r.ok) return;
    const seedIds = ((await r.json()).content || []).map(c => c.id).slice(0, 5);
    if (!seedIds.length) return;
    const musical = target >= 120 ? target / 2 : target;
    const rr = await fetch(RB + '/track/recommendation?size=20&seeds=' + seedIds.join(',') + '&tempo=' + Math.round(musical));
    if (!rr.ok) return;
    const recs = ((await rr.json()).content || [])
      .map(c => ({ name: c.trackTitle, artists: (c.artists || []).map(a => a.name).join(', '),
                   spid: (c.href || '').match(/track\/([A-Za-z0-9]+)/)?.[1] }))
      .filter(x => x.spid && !discSeen.has(x.spid) && !library.some(t => t.id === x.spid))
      .slice(0, 6);
    if (!recs.length) return;
    recs.forEach(x => discSeen.add(x.spid));
    $('discList').insertAdjacentHTML('beforeend', recs.map(x =>
      '<div class="discRow"><div class="dLeft"><div class="dName">' + esc(x.name) + '</div><div class="dArtist">' + esc(x.artists) + '</div></div>' +
      '<button class="qBtn" data-spid="' + x.spid + '">+</button></div>').join(''));
    $('discCard').style.display = 'block';
    $('discList').querySelectorAll('.qBtn:not([data-wired])').forEach(b => {
      b.dataset.wired = '1';
      b.addEventListener('click', async () => {
        try {
          await spotify('/me/player/queue?uri=' + encodeURIComponent('spotify:track:' + b.dataset.spid), { method: 'POST' });
          b.textContent = '·'; b.classList.add('done');
        } catch (e) { b.textContent = '×'; }
      });
    });
  } catch (e) { /* discovery is a gift, never a demand */ }
}
$('moreDisc').addEventListener('click', () => discover(false));

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ============ wind down — the set descends with you ============ */
async function windDown() {
  const lower = library
    .map(t => ({ ...t, grid: stepGridOf(t.tempo) }))
    .filter(t => t.grid >= target - 14 && t.grid <= target - 4)
    .sort((a, b) => (b.grid - a.grid) || (a.energy - b.energy));   // descending tempo, calm first
  if (!lower.length) return;
  try { await playUris(lower.slice(0, 12).map(t => 'spotify:track:' + t.id)); } catch (e) {}
  $('windBtn').textContent = 'descending…';
  setTimeout(() => { $('windBtn').textContent = 'wind down'; }, 4000);
  setTimeout(pollPlayer, 600);
}

/* ============ controls ============ */
async function requestWake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (running || phase === 'stride')) requestWake();
});

$('runBtn').addEventListener('click', startRun);
$('slider').addEventListener('input', () => { sliderTouched = true; stableSince = null; $('lockNum').textContent = $('slider').value; });
$('lockNowBtn').addEventListener('click', lockTarget);
$('skipBtn').addEventListener('click', () => { spotify('/me/player/next', { method: 'POST' }).catch(() => {}); setTimeout(pollPlayer, 500); });
$('pauseBtn').addEventListener('click', async () => {
  try {
    const p = await spotify('/me/player');
    if (p && p.is_playing) { await spotify('/me/player/pause', { method: 'PUT' }); $('pauseBtn').textContent = 'play'; }
    else { await spotify('/me/player/play', { method: 'PUT' }); $('pauseBtn').textContent = 'pause'; }
  } catch (e) {}
});
$('windBtn').addEventListener('click', windDown);
$('stopBtn').addEventListener('click', () => {
  spotify('/me/player/pause', { method: 'PUT' }).catch(() => {});
  wakeLock?.release().catch(() => {});
  backToGate('');
});

/* ============ boot ============ */
(async () => {
  if (!(await ensureToken().catch(() => null))) {
    $('err').innerHTML = 'first, <a href="../p3/">a word with spotify</a>. then only running.';
    return;
  }
  loadLibrary().catch(e => { $('poolLine').textContent = ''; $('err').textContent = 'library: ' + e.message; });
})();
</script>
